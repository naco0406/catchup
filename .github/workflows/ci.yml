name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @catchup/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # 한 칸이 다른 칸의 줄을 읽지 못하는 경계 시험(plan.md 2단계)
  api:
    runs-on: ubuntu-24.04
    env:
      CATCHUP_DB_OWNER_PASSWORD: ci-only-owner-password
      CATCHUP_DB_APP_PASSWORD: cionlyapppasswordcionlyapppassword0000
      CATCHUP_MASTER_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      CATCHUP_TEST_PREFIX: catchup_ci
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_DB: catchup
          POSTGRES_USER: catchup_owner
          POSTGRES_PASSWORD: ci-only-owner-password
        ports: ["127.0.0.1:55433:5432"]
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username catchup_owner --dbname catchup"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh postgresql-client
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p catchup-api --lib
      - run: cargo test --locked -p catchup-api --test stage2 -- --test-threads=4
      - run: zsh services/api/tests/schema.sh
        env:
          CATCHUP_PSQL: psql -h 127.0.0.1 -p 55433
          PGPASSWORD: ci-only-owner-password
