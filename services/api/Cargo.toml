[package]
name = "catchup-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 판은 AI1(main 613eabb 뒤)의 Cargo.lock 과 같은 데서 시작해 고정해요(design.md 13장)
[dependencies]
anyhow = "=1.0.100"
axum = { version = "=0.8.6", features = ["json", "ws"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
futures-util = "=0.3.34"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "=2.6.1"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "process"] }
tower-http = { version = "=0.6.6", features = ["trace", "timeout", "request-id", "limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "=5.5.0", features = ["uuid", "chrono"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
